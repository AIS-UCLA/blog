name: deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to Hetzner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      # Pinned host keys for cherf.aisafetyatucla.org, so a DNS change can
      # never send a deploy to another server. If the server is rebuilt,
      # verify its new fingerprints out of band before updating these.
      - run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/known_hosts <<'EOF'
          cherf.aisafetyatucla.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBGNZbKSHWt10TWkDLDT2hDUHZC9zjAYHdN2rcQDH+tB
          cherf.aisafetyatucla.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBH5DQe5HsGJioGKFNcD3olLoa/u3uv4d1af5AtGIhTnrZ6tWoXmLL9puFgT3a90ik/nqpPlrGtjpC0Xlx/6++bE=
          cherf.aisafetyatucla.org ssh-rsa 
          EOF
      - run: rsync -avz -e "ssh -o StrictHostKeyChecking=yes -l www" _site/ cherf.aisafetyatucla.org:/www/blog.ais-ucla.org
